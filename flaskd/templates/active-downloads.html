{% extends "base.html" %}
{% block title %}Active Downloads{% endblock %}
{% block head %}
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
{% endblock %}

{% block content %}
<h1 class="page-title">Downloads</h1>
<p class="page-subtitle" id="connection-status" role="status">Connecting…</p>
<p id="action-error" class="notice notice-danger" role="alert" hidden></p>

<div id="downloads-container">
    <div class="empty-state">
        <p>Loading downloads…</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
var socket = io();
socket.on('connect', function() { document.getElementById('connection-status').textContent = 'Connected'; });
socket.on('disconnect', function() { document.getElementById('connection-status').textContent = 'Disconnected · Reconnecting…'; });
socket.on('connect_error', function() { document.getElementById('connection-status').textContent = 'Unable to connect · Retrying…'; });

function esc(str) {
    var d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
}

function formatEta(seconds) {
    if (seconds <= 0 || seconds >= 8640000) return '∞';
    if (seconds > 3600) return Math.floor(seconds / 3600) + 'h ' + Math.floor((seconds % 3600) / 60) + 'm';
    if (seconds > 60) return Math.floor(seconds / 60) + 'm ' + (seconds % 60) + 's';
    return seconds + 's';
}

function post(url, hash) {
    document.getElementById('action-error').hidden = true;
    return fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: 'hash=' + encodeURIComponent(hash)
    }).then(function(response) {
        if (!response.ok) throw new Error('Request failed');
        return response;
    }).catch(function() {
        var error = document.getElementById('action-error');
        error.textContent = 'Could not update the download. Try again.';
        error.hidden = false;
    });
}

function pauseTorrent(hash)    { post('/pause-torrent', hash); }
function resumeTorrent(hash)   { post('/resume-torrent', hash); }
function reannounceTorrent(hash){ post('/reannounce-torrent', hash); }
function boostTorrent(hash, btn) {
    if (btn) { btn.disabled = true; btn.textContent = 'Boosting…'; }
    post('/boost-torrent', hash).finally(function() {
        if (btn) { setTimeout(function(){ btn.disabled = false; btn.textContent = 'Boost'; }, 2000); }
    });
}

function removeTorrent(hash) {
    if (confirm('Remove this download from qBittorrent?')) {
        post('/remove-torrent', hash);
    }
}

// Map raw qBit state strings to a friendly label + a CSS-friendly tag.
// Keep this list permissive — anything not matched falls through to a
// generic "unknown state" badge, which is still better than the torrent
// silently disappearing from the page.
var STATE_LABELS = {
    'metaDL':             {label: 'fetching metadata', tag: 'state-meta'},
    'stalledDL':          {label: 'stalled — no peers', tag: 'state-stalled'},
    'queuedDL':           {label: 'queued', tag: 'state-queued'},
    'downloading':        {label: 'downloading', tag: 'state-dl'},
    'forcedDL':           {label: 'force downloading', tag: 'state-dl'},
    'checkingDL':         {label: 'checking', tag: 'state-check'},
    'checkingResumeData': {label: 'resuming', tag: 'state-check'},
    'allocating':         {label: 'allocating', tag: 'state-check'},
    'moving':             {label: 'moving files', tag: 'state-check'},
    'pausedDL':           {label: 'paused', tag: 'state-paused'},
    'stoppedDL':          {label: 'stopped', tag: 'state-paused'},
    'error':              {label: 'error', tag: 'state-error'},
    'missingFiles':       {label: 'missing files', tag: 'state-error'},
    'unknown':            {label: 'unknown', tag: 'state-error'}
};

socket.on('update_downloads', function(downloads) {
    var container = document.getElementById('downloads-container');
    if (!downloads || downloads.length === 0) {
        container.innerHTML = '<div class="empty-state"><h2>No active downloads</h2><a class="btn" href="/">Search</a></div>';
        return;
    }
    container.innerHTML = '';
    downloads.forEach(function(d) {
        var card = document.createElement('div');
        card.className = 'download-card';
        var isPaused = d.state === 'pausedDL' || d.state === 'stoppedDL';
        var stateInfo = STATE_LABELS[d.state] || {label: d.state || 'unknown', tag: 'state-error'};
        var isStuck = (d.state === 'metaDL' || d.state === 'stalledDL' || d.state === 'error' || d.state === 'missingFiles');

        var toggleBtn = isPaused
            ? '<button class="btn btn-sm btn-success" onclick="resumeTorrent(\'' + d.hash + '\')">Resume</button>'
            : '<button class="btn btn-sm" onclick="pauseTorrent(\'' + d.hash + '\')">Pause</button>';

        // Boost is the headline action when a torrent is stuck. Otherwise still
        // available but de-emphasised.
        var boostBtn = '<button class="btn btn-sm ' + (isStuck ? 'btn-warning' : '') + '" '
            + 'onclick="boostTorrent(\'' + d.hash + '\', this)" '
            + 'title="Re-inject public trackers, force-start, then reannounce">Boost</button>';
        var reannBtn = '<button class="btn btn-sm" onclick="reannounceTorrent(\'' + d.hash + '\')" '
            + 'title="Force a fresh tracker announce">Reannounce</button>';

        var hint = '';
        if (d.state === 'metaDL') {
            hint = '<div class="dl-hint">Waiting for metadata. <b>Boost</b> adds trackers and retries peer discovery.</div>';
        } else if (d.state === 'stalledDL') {
            hint = '<div class="dl-hint">No peers connected. Try <b>Boost</b>, or pick a torrent with more seeders.</div>';
        } else if (d.state === 'error' || d.state === 'missingFiles') {
            hint = '<div class="dl-hint">qBittorrent reported an error. Check the qBittorrent Web UI for details.</div>';
        } else if (d.state === 'stoppedDL' || d.state === 'pausedDL') {
            hint = '<div class="dl-hint">This download is stopped. Select <b>Resume</b> to continue.</div>';
        }

        var peers = '<span>Seeds / peers: ' + (d.num_seeds || 0) + ' / ' + (d.num_leechs || 0) + '</span>';
        var stateBadge = '<span class="state-badge ' + stateInfo.tag + '">' + esc(stateInfo.label) + '</span>';

        card.innerHTML =
            '<div class="dl-name">' + esc(d.name || d.content_path) + ' ' + stateBadge + '</div>' +
            '<div class="dl-stats">' +
                '<span>' + d.dlspeed.toFixed(2) + ' MB/s</span>' +
                '<span>Remaining: ' + formatEta(d.eta) + '</span>' +
                peers +
                '<span>' + d.progress + '%</span>' +
            '</div>' +
            '<div class="progress-bar"><div class="progress-fill" style="width:' + d.progress + '%"></div></div>' +
            hint +
            '<div class="download-actions">' +
                toggleBtn +
                boostBtn +
                reannBtn +
                '<button class="btn btn-sm btn-danger" onclick="removeTorrent(\'' + d.hash + '\')">Remove</button>' +
            '</div>';
        container.appendChild(card);
    });
});
</script>
{% endblock %}
