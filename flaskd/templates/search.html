{% extends "base.html" %}
{% block title %}Ripley — Search{% endblock %}

{% block content %}
<section class="card search-primary">
    <h1 class="page-title">Search</h1>
    <form action="/search" method="get">
        <div class="search-row">
            <input class="form-input" id="query" aria-label="Search torrents" type="text" name="query" placeholder="Title, year or episode…" required autofocus>
            <button type="submit" class="btn btn-primary">Search</button>
        </div>
    </form>
    {% if vpn_bypass %}
    <div class="notice notice-danger">VPN check bypass is active.</div>
    {% endif %}
</section>

<div class="search-secondary">
<section class="card magnet-panel">
    <h2 class="card-title">Magnet link</h2>
    <form action="/download-magnet" method="post">
        <div class="search-row">
            <input class="form-input" aria-label="Magnet link" type="text" name="magnet" placeholder="magnet:?xt=urn:btih:…" required>
            <button type="submit" class="btn">Download</button>
        </div>
    </form>
</section>

<section class="card location-panel">
    <h2 class="card-title">Download location</h2>
    <form action="/set-download-dir" method="post" class="inline-form">
        <input class="form-input" aria-label="Download location" type="text" name="download_dir" value="{{ download_dir }}" required>
        <button type="submit" class="btn">Change</button>
    </form>
</section>
</div>
{% endblock %}
