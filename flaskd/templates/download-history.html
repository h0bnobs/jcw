{% extends "base.html" %}
{% block title %}Download History{% endblock %}

{% block content %}
<h1 class="page-title">History</h1>
<p class="page-subtitle">Select a file to open it.</p>

{% if downloads %}
{% for download in downloads %}
<div class="history-item">
    <a class="file-name" href="/open/{{ download }}">{{ download }}</a>
    <div class="file-actions">
        <form action="/delete-file" method="post" onsubmit="return confirm('Delete this file?')">
            <input type="hidden" name="filename" value="{{ download }}">
            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
        </form>
    </div>
</div>
{% endfor %}
{% else %}
<div class="empty-state">
    <h2>No downloaded files</h2>
    <a class="btn" href="/">Search</a>
</div>
{% endif %}
{% endblock %}
