<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Ripley{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">
        <img src="/static/img/ripley.png" alt="Logo" class="logo">
        <span class="brand-name">Ripley</span>
    </a>
    <button class="menu-toggle" onclick="document.querySelector('.nav').classList.toggle('open')" aria-label="Menu">
        <span></span><span></span><span></span>
    </button>
    <nav class="nav">
        <a href="/" class="{{ 'active' if request.endpoint in ('home', 'search') }}">home</a>
        <a href="/active-downloads" class="{{ 'active' if request.endpoint == 'active_downloads' }}">downloads</a>
        <a href="/download-history" class="{{ 'active' if request.endpoint == 'download_history' }}">history</a>
        <a href="/advanced-settings" class="{{ 'active' if request.endpoint == 'advanced_settings' }}">settings</a>
        <a href="/qbit">qBittorrent</a>
    </nav>
</header>

<main class="wrap">
    {% block content %}{% endblock %}
</main>

<footer class="foot"></footer>

{% block scripts %}{% endblock %}
</body>
</html>
