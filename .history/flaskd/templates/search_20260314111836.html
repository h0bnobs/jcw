{% extends "base.html" %}
{% block title %}Ripley — Search{% endblock %}

{% block content %}
<section class="card">
    <h3 class="card-title">search for anything</h3>
    <form action="/search" method="get">
        <div class="search-row">
            <input class="form-input" id="query" type="text" name="query" placeholder="search for a show, film, or anything…" required autofocus>
            <button type="submit" class="btn btn-primary">search</button>
        </div>
    </form>
    {% if vpn_bypass %}
    <div class="notice notice-danger">vpn check bypass is active.</div>
    {% endif %}
</section>

<section class="card">
    <h3 class="card-title">paste a magnet link</h3>
    <form action="/download-magnet" method="post">
        <div class="search-row">
            <input class="form-input" type="text" name="magnet" placeholder="magnet:?xt=urn:btih:…" required>
            <button type="submit" class="btn btn-primary">download</button>
        </div>
    </form>
</section>

<section class="card">
    <h3 class="card-title">download location</h3>
    <form action="/set-download-dir" method="post" class="inline-form">
        <input class="form-input" type="text" name="download_dir" value="{{ download_dir }}" required>
        <button type="submit" class="btn">change</button>
    </form>
</section>
{% endblock %}
