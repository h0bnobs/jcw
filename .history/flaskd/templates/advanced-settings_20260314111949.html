{% extends "base.html" %}
{% block title %}Settings{% endblock %}

{% block content %}
<h1 class="page-title">settings</h1>
<p class="page-subtitle">advanced configuration</p>

<div class="card">
    <h3 class="card-title">general</h3>
    <form method="POST" action="/advanced-settings" id="settings-form">
        <div class="setting-row">
            <div class="setting-info">
                <div class="setting-label">VPN bypass</div>
                <div class="setting-desc">skip the VPN check before searching and downloading</div>
            </div>
            <label class="toggle">
                <input type="checkbox" name="vpn_bypass" {% if vpn_bypass %}checked{% endif %}
                       onchange="document.getElementById('settings-form').submit()">
                <span class="toggle-slider"></span>
            </label>
        </div>
    </form>
</div>

<div class="card">
    <h3 class="card-title">tools</h3>
    <div class="setting-row">
        <div class="setting-info">
            <div class="setting-label">Fix Jellyfin directory</div>
            <div class="setting-desc">run chown on /media for jellyfin access</div>
        </div>
        <a href="/jellyfin" class="btn btn-sm">run</a>
    </div>
</div>
{% endblock %}
